<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi des dépenses</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>€</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/chart.umd.js"></script>
</head>
<body>
  <aside id="sidebar">
    <button id="sidebar-toggle" aria-expanded="true" aria-label="Réduire le panneau">‹</button>
    <section id="import-section">
      <h2>Import</h2>
      <label class="file-label">
        Relevé bancaire
        <input type="file" id="file-input" accept=".csv">
      </label>
    </section>
    <section id="rules-section">
      <h2>Règles d'exclusion</h2>
      <ul id="rules-list" data-region="rules-list"></ul>
      <div class="rule-add">
        <input type="text" id="new-rule-input" placeholder="Nouvelle règle…">
        <button id="add-rule-btn">Ajouter</button>
      </div>
    </section>
  </aside>

  <main id="main">
    <section id="overview-section">
      <h2>Vue d'ensemble mensuelle</h2>
      <div data-region="metrics"></div>
      <canvas id="overview-chart"></canvas>
    </section>

    <section id="drilldown-section">
      <h2>Détail</h2>
      <div class="filters-bar">
        <div id="drilldown-filters" data-region="drilldown-filters"></div>
        <label class="search-label">
          Recherche
          <input type="search" id="filter-search" placeholder="Dans le libellé…">
        </label>
      </div>
      <div data-region="drilldown-table"></div>
    </section>

    <p id="empty-state">Importez un export CSV BoursoBank pour commencer.</p>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
