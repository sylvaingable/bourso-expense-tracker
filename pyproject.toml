[project]
name = "expense-tracker"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "streamlit",
    "plotly",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
